name: Korat SaaS CI Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 3. Instalar dependencias limpias
        run: npm ci

      - name: 4. Verificación de tipos TypeScript (tsc)
        run: npx tsc --noEmit

      - name: 5. Linter (ESLint)
        run: npm run lint

      - name: 6. Compilación de producción Next.js
        env:
          DATABASE_URL: "postgresql://postgres:password123@localhost:5432/korat_db"
          DIRECT_URL: "postgresql://postgres:password123@localhost:5432/korat_db"
          JWT_SECRET: "ci_test_secret_key_for_build_verification_2026"
        run: npm run build

