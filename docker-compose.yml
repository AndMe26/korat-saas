services:
  postgres:
    image: postgres:16-alpine
    container_name: korat_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: korat_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d korat_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: korat_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:password123@postgres:5432/korat_db"
      DIRECT_URL: "postgresql://postgres:password123@postgres:5432/korat_db"
      JWT_SECRET: "korat_saas_super_secret_jwt_key_docker_2026"
      GEMINI_MODEL: "gemini-2.5-flash"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
